# Admin panel (Decap CMS) for uploading project photos.
# Open it at  <your-site>/admin/   – locally: http://localhost:3000/admin/index.html
# Setup and day-to-day steps are in README.md → "Uploading project photos".

backend:
  name: github
  repo: imstorage9-cmd/insidemantra-website
  branch: main
  commit_messages:
    create: "Add project: {{slug}}"
    update: "Update project: {{slug}}"
    delete: "Remove project: {{slug}}"
    uploadMedia: "Upload photo {{path}}"
    deleteMedia: "Delete photo {{path}}"

# Lets you try the panel on this computer without logging in (run `npm run cms` alongside `npm run dev`).
local_backend: true

site_url: https://insidemantra.com

# Required site-wide default. Project photos do NOT go here; they go into each project's own folder (below).
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: projects
    label: Projects
    label_singular: Project
    description: >
      Existing project? Click its name in the list below and add photos.
      New project? Click "New Project", enter the project name, then add photos.
      Each project automatically has Kitchen, Bedroom and Living Room sections.
      Leave a section empty if it doesn't apply – empty sections are hidden on the website.

    # Each project = its own folder: public/projects/<project-name>/index.json + its photos.
    folder: public/projects
    path: "{{slug}}/index"
    format: json
    extension: json
    media_folder: ""
    public_folder: ""
    create: true
    delete: true
    slug: "{{title}}"
    identifier_field: title
    summary: "{{title}}  ·  {{location}}"
    sortable_fields: ["date", "title"]

    fields:
      - label: Project name
        name: title
        widget: string
        hint: "e.g. Reddy Residence, Banjara Hills. This becomes the project's web address, so double-check spelling before the first save."

      - label: City
        name: location
        widget: select
        required: false
        options: ["Vijayawada", "Visakhapatnam", "Hyderabad", "Other"]

      - label: Date
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "DD MMM YYYY"
        time_format: false
        default: "{{now}}"
        hint: "Newest projects are shown first on the website."

      - label: Short description
        name: description
        widget: text
        required: false
        hint: "Optional. 1–3 sentences about the project, shown at the top of its page."

      - label: Cover photo
        name: cover
        widget: image
        required: false
        choose_url: false
        hint: "Optional. The photo shown on the project card. If empty, the first room photo is used."

      # ── Default rooms – every project gets these three ──────────────────
      - label: Kitchen photos
        name: kitchen
        widget: list
        required: false
        label_singular: kitchen photo
        field: { label: Photo, name: photo, widget: image, choose_url: false }

      - label: Bedroom photos
        name: bedroom
        widget: list
        required: false
        label_singular: bedroom photo
        field: { label: Photo, name: photo, widget: image, choose_url: false }

      - label: Living Room photos
        name: living_room
        widget: list
        required: false
        label_singular: living room photo
        field: { label: Photo, name: photo, widget: image, choose_url: false }

      # ── Anything else ───────────────────────────────────────────────────
      - label: Other rooms
        name: other_rooms
        widget: list
        required: false
        label_singular: room
        summary: "{{fields.name}}"
        hint: "Optional. For rooms beyond the three above, e.g. Pooja Room, Kids Room, Dining, Balcony."
        fields:
          - { label: Room name, name: name, widget: string }
          - label: Photos
            name: photos
            widget: list
            label_singular: photo
            field: { label: Photo, name: photo, widget: image, choose_url: false }
