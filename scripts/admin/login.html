<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Log in · Inside Mantra Admin</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #faf7f2; color: #1f1b16;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      form { width: min(380px, 92vw); background: #fff; border: 1px solid #e2d9cb; border-radius: 18px; padding: 36px; }
      h1 { margin: 0; font: 600 28px/1.2 Georgia, serif; }
      p { margin: 6px 0 24px; color: #6b6258; font-size: 14px; }
      label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
      input { width: 100%; padding: 12px 14px; border: 1px solid #d8cdbd; border-radius: 10px; font-size: 16px; }
      input:focus { outline: 2px solid #9a6a36; outline-offset: 1px; }
      button { width: 100%; margin-top: 18px; padding: 12px; border: 0; border-radius: 999px; background: #9a6a36; color: #fff;
        font-size: 16px; font-weight: 600; cursor: pointer; }
      button:hover { background: #7d5328; }
      .error { margin: 0 0 16px; padding: 10px 12px; border-radius: 10px; background: #fbe9e7; color: #a12f20; font-size: 14px; }
    </style>
  </head>
  <body>
    <form method="post" action="/admin/login/">
      <h1>Inside Mantra</h1>
      <p>Photo admin: log in to add project photos.</p>
      <div class="error" id="error" hidden>Wrong password. Please try again.</div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
      <button type="submit">Log in</button>
    </form>
    <script>
      if (new URLSearchParams(location.search).has("error")) document.getElementById("error").hidden = false;
    </script>
  </body>
</html>
